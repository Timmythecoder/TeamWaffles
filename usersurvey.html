<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Surveys</title>
  <script src="user.js" type="module" defer></script>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #2b2b2b;
      margin: 0;
      padding: 0;
      color: #f5f5f5;
      text-align: center;
    }
    .container {
      max-width: 1200px;
      margin: 50px auto;
      padding: 20px;
      background-color: #444;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      border-radius: 10px;
      position: relative;
    }
    h1 {
      font-size: 2em;
      margin-bottom: 20px;
      color: #61dafb;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background-color: #3e3e3e;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      text-align: left;
    }
    .card .question-number {
      font-size: 1.5em;
      font-weight: bold;
      color: #a5fbb5;
      margin-bottom: 10px;
    }
    .card .question-text {
      margin-bottom: 15px;
      color: #f8f8f8;
    }
    .card input[type="text"], 
    .card textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background-color: #555;
      border: 1px solid #61dafb;
      border-radius: 5px;
      color: #f5f5f5;
      font-size: 1em;
      resize: none;
    }
    .card textarea {
      height: 100px;
    }
    .home-button, .back-button {
      display: inline-block;
      padding: 10px 20px;
      margin: 20px 10px;
      background-color: #a5fbb5;
      color: #2b2b2b;
      border: 2px solid #61dafb;
      border-radius: 10px;
      text-decoration: none;
      font-size: 1.2em;
      transition: transform 0.2s, background-color 0.2s;
    }
    .home-button:hover, .back-button:hover {
      background-color: #61dafb;
      color: #fff;
      transform: scale(1.05);
    }
    .completion-screen {
      display: none;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      background-color: #2b2b2b;
    }
    .completion-screen .tick {
      font-size: 4em;
      color: #a5fbb5;
      margin-bottom: 20px;
    }
    .completion-screen h2 {
      color: #61dafb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Team Waffles Survey</h1>
    <div id="survey-container" class="grid">
      <!-- Example Questions -->
      <div class="card">
        <div class="question-number">1.</div>
        <div class="question-text">Q1</div>
        <input type="text" placeholder="Type your answer here">
      </div>
      <div class="card">
        <div class="question-number">2.</div>
        <div class="question-text">Q2</div>
        <input type="text" placeholder="Type your answer here">
      </div>
      <div class="card">
        <div class="question-number">3.</div>
        <div class="question-text">Q3</div>
        <textarea placeholder="Type your answer here"></textarea>
      </div>
    </div>

    <!-- Submit Button -->
    <button id="submit-survey" class="home-button">Submit Survey</button>
  </div>

  <div class="completion-screen" id="completion-screen">
    <div>
      <div class="tick">✔</div>
      <h2>Survey Completed Successfully!</h2>
      <a href="dashboard.html" class="home-button">Back to Dashboard</a>
    </div>
  </div>

  <script>
    // JavaScript: Show the completion screen after survey is submitted
    document.getElementById("submit-survey").addEventListener("click", () => {
      document.querySelector(".container").style.display = "none";
      document.getElementById("completion-screen").style.display = "flex";
    });
  </script>
</body>
</html>
