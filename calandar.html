<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Waffles - Zoom Announcements</title>
    <link rel="icon" href="TWL O - Copy.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #333;
            color: #fff;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .light-mode {
            background-color: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .light-mode .container {
            color: #333;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .heading {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 20px;
            color: #ffd700;
        }

        .light-mode .heading {
            color: #000000;
        }

        .zoom-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .zoom-details {
            padding: 20px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .light-mode .zoom-details {
            background: linear-gradient(135deg, #84c3e2, #507dca);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .zoom-details:hover {
            transform: translateY(-5px);
        }

        .zoom-details h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .zoom-details p {
            font-size: 1rem;
            margin-bottom: 10px;

        }

        .zoom-details a {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
            background: #507dca;
            border-radius: 8px;
            transition: background 0.3s ease;
        }

        .zoom-details a:hover {
            background: #3b5aa8;
        }

        .light-mode .zoom-details a {
            background: #ffd700;
            color: #333;
        }

        .light-mode .zoom-details a:hover {
            background: #e0b000;
        }

        .toggle-button {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            z-index: 1000;
        }

        .light-mode .toggle-button {
            background: linear-gradient(135deg, #84c3e2, #507dca);
            color: #333;
        }

        .back-home {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
            background: #507dca;
            border-radius: 8px;
            transition: background 0.3s ease;
            text-align: center;
        }

        .back-home:hover {
            background: #3b5aa8;
        }
    </style>
</head>

<body>
    <button class="toggle-button" onclick="toggleMode()">🌙 / 🌞</button>

    <div class="container">
        <h1 class="heading">Zoom Announcements</h1>
        <div id="zoom-container" class="zoom-section">
            <!-- Dynamic Zoom Details will load here -->
            <p>Loading Zoom details...</p>
        </div>
        <a href="index.html" class="back-home">Back to Home</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAPl8uaPdFS89m6X4M3OrzTSSeHhw-GkRkRk",
            authDomain: "team-waffles-acs.firebaseapp.com",
            projectId: "team-waffles-acs",
            storageBucket: "team-waffles-acs.appspot.com",
            messagingSenderId: "636130806538",
            appId: "1:636130806538:web:281c39ba2e72debd2748f3",
            measurementId: "G-HEC29JWVFL"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function toggleMode() {
            const currentMode = localStorage.getItem("mode") || "light";
            const body = document.body;
            if (currentMode === "dark") {
                body.classList.remove("dark-mode");
                body.classList.add("light-mode");
                localStorage.setItem("mode", "light");
            } else {
                body.classList.remove("light-mode");
                body.classList.add("dark-mode");
                localStorage.setItem("mode", "dark");
            }
        }

        window.onload = function () {
            const savedMode = localStorage.getItem("mode") || "light";
            document.body.classList.add(savedMode === "dark" ? "dark-mode" : "light-mode");
        };

        function loadZoomDetails() {
            const zoomRef = db.ref("content/zoom/nextMeeting");
            zoomRef.on("value", (snapshot) => {
                const zoomData = snapshot.val();
                updateZoomDetails(zoomData);
            });
        }

        function updateZoomDetails(data) {
            const zoomContainer = document.getElementById("zoom-container");

            if (!data) {
                zoomContainer.innerHTML = "<p>No upcoming Zoom meetings scheduled.</p>";
                return;
            }

            const { title, link, time } = data;
            const meetingTime = new Date(time).toLocaleString(undefined, {
                dateStyle: "medium",
                timeStyle: "short",
            });

            zoomContainer.innerHTML = `
                <div class="zoom-details">
                    <h2>${title || "Upcoming Zoom Meeting"}</h2>
                    <p><strong>Time:</strong> ${meetingTime}</p>
                    <a href="${link}" target="_blank">Join Meeting</a>
                </div>
            `;
        }

        loadZoomDetails();
    </script>
</body>

</html>
