<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Waffles Phone</title>
    <link rel="icon" href="TWL O - Copy.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            margin: 0;
            padding: 60px;
            transition: background-color 0.5s ease;
        }

        .content {
            height: calc(100% - 75px); /* Adjust for status bar height */
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* Three icons per row */
            gap: 2px;
            padding: 3px;
            justify-items: center;
            align-items: center;
        }

        .app img {
            width: 70px; /* Adjust size as needed */
            height: 70px; /* Maintain square shape */
            max-width: 100%;
            max-height: 100%;
            border-radius: 12px; /* Rounded corners */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s; /* Add hover effect */
        }

        .app img:hover {
            transform: scale(1.1); /* Slight zoom on hover */
        }

        h1 {
            text-align: center;
            color: #fff;
        }

        #ads-container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
            margin: 20px 0;
            align-items: flex-start;
        }

        .ads-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .container {
            grid-column: 2;
        }

        .ad {
            width: 100%;
            max-width: 300px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .ad h2 {
            font-size: 20px;
            color: #ffd700;
        }

        .ad p {
            font-size: 16px;
            color: #dcdcdc;
        }

        .ad-image,
        .ad-video {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 10px;
        }

        #banner {
            background: rgba(255, 235, 59, 0.9);
            color: #333;
            padding: 15px;
            text-align: center;
            font-size: 1.4em;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .weather-widget {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 1.2em;
        }

        .weather-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .weather-icon {
            font-size: 1.5em;
        }

        /* Light Mode Styles */
        .light-mode {
            background: linear-gradient(135deg, #84c3e2, #507dca);
            color: #fff;
        }

        /* Dark Mode Styles */
        .dark-mode {
            background: #333;
            color: #fff;
        }

        .toggle-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <button class="toggle-button" onclick="toggleMode()">🌙 / 🌞</button>



        <div class="container">
            <div id="banner">why did you click on the logo? here's a code</div>
            <div id="banner">SECRET#LOGO</div>

            <div class="iphone">
                <div class="screen">
                    <br>

                    <div class="weather-widget">
                        <div class="weather-info">
                            <span class="weather-icon">🎉</span>
                            <span class="weather-temp">Welcome</span>
                            <span class="weather-location">To Team Waffles 🎉</span>
                        </div>
                    </div>

                    <div class="status-bar">
                        <div class="signal-strength">
                            <div class="bar bar-1"></div>
                            <div class="bar bar-2"></div>
                            <div class="bar bar-3"></div>
                            <div class="bar bar-4"></div>
                        </div>
                        <span id="current-time"></span>
                        <div class="battery"></div>
                    </div>

                    <div class="content">

                     
                        <div class="app" onclick="navigateTo('index.html')">
                            <img src="TWL O - Copy.png" alt="Login Icon">
                     
                     
                    </div>
                </div>
            </div>
        </div>

        
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAPl8uaPdFS89m6X4M3OrzTSSeHhw-GkRkRk",
            authDomain: "team-waffles-acs.firebaseapp.com",
            projectId: "team-waffles-acs",
            storageBucket: "team-waffles-acs.appspot.com",
            messagingSenderId: "636130806538",
            appId: "1:636130806538:web:281c39ba2e72debd2748f3",
            measurementId: "G-HEC29JWVFL"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function loadAds() {
            const adsRef = db.ref("content/ads");
            adsRef.on("value", (snapshot) => {
                const adsData = snapshot.val() || {};
                updateAds(adsData);
            });
        }

        function updateAds(data) {
            const leftAds = document.getElementById("left-ads");
            const rightAds = document.getElementById("right-ads");

            leftAds.innerHTML = createAdHTML(data.firstAd) + createAdHTML(data.thirdAd);
            rightAds.innerHTML = createAdHTML(data.secondAd) + createAdHTML(data.fourthAd);
        }

        function createAdHTML(ad) {
            if (!ad) return '<div class="ad"><h2>No ad available</h2></div>';
            return `
                <div class="ad">
                    <h2>${ad.title || "Advertisement"}</h2>
                    <p>${ad.text || ""}</p>
                    ${ad.image ? `<img src="${ad.image}" alt="Ad Image" class="ad-image">` : ""}
                    ${ad.video ? `<video class="ad-video" autoplay muted loop><source src="${ad.video}" type="video/mp4"></video>` : ""}
                </div>
            `;
        }

        function loadDemoWeather() {
            const weatherWidget = document.querySelector('.weather-widget');
            const weatherIcon = document.querySelector('.weather-icon');
            const weatherTemp = document.querySelector('.weather-temp');
            const weatherLocation = document.querySelector('.weather-location');

            // Mock weather data
      //      const mockWeather = {
        //        icon: "☀️", // Change icon to "☁️", "🌧️", etc., for different weather
         //       temperature: "25°C",
         //       location: "Athens"
        //    };

            weatherIcon.textContent = mockWeather.icon;
            weatherTemp.textContent = mockWeather.temperature;
            weatherLocation.textContent = mockWeather.location;
        }

        // Load weather data on page load
        window.onload = loadDemoWeather;

        function navigateTo(url) {
            if (url) {
                window.location.href = url; // Redirect to the specified URL
            } else {
                alert("Feature not implemented yet!"); // Show a message for non-functional apps
            }
        }

        function toggleMode() {
            const currentMode = localStorage.getItem("mode");
            const body = document.body;

            if (currentMode === "dark") {
                body.classList.remove("dark-mode");
                body.classList.add("light-mode");
                localStorage.setItem("mode", "light");
            } else {
                body.classList.remove("light-mode");
                body.classList.add("dark-mode");
                localStorage.setItem("mode", "dark");
            }
        }

        // Set mode based on local storage preference
        window.onload = function () {
            const savedMode = localStorage.getItem("mode") || "light";
            document.body.classList.add(savedMode === "dark" ? "dark-mode" : "light-mode");
        };

        loadAds();
    </script>
</body>

</html>
