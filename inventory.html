<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #2b2b2b;
            margin: 0;
            padding: 0;
            color: #f5f5f5;
            text-align: center;
        }

        .container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
            background-color: #444;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #61dafb;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            justify-content: center;
        }

        .feature-card {
            background-color: #3e3e3e;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            overflow: hidden;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            cursor: pointer;
            max-width: 120px;
            margin: 0 auto;
        }

        .feature-card img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }

        .feature-card.enlarged {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(2);
            z-index: 1000;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            cursor: zoom-out;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 999;
            display: none;
        }

        .home-button {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #a5fbb5;
            color: #2b2b2b;
            border: 2px solid #61dafb;
            border-radius: 10px;
            text-decoration: none;
            font-size: 1.2em;
            transition: transform 0.2s, background-color 0.2s;
        }

        .home-button:hover {
            background-color: #61dafb;
            color: #fff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Inventory</h1>
        <div class="grid" id="inventory-grid">
            <!-- Cards will be dynamically added here -->
        </div>
        <a href="shop.html" class="home-button">Back to Home</a>
    </div>

    <div class="overlay" id="overlay"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js';
        import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAPl8uaPdFS89m6X4M3OrzTSSeHhw-GkRkRk",
            authDomain: "team-waffles-acs.firebaseapp.com",
            projectId: "team-waffles-acs",
            storageBucket: "team-waffles-acs.appspot.com",
            messagingSenderId: "636130806538",
            appId: "1:636130806538:web:281c39ba2e72debd2748f3",
            measurementId: "G-HEC29JWVFL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const username = localStorage.getItem('username') || "Abi";
        const cardsRef = ref(db, `users/${username}/cards`);

        const inventoryGrid = document.getElementById("inventory-grid");
        const overlay = document.getElementById("overlay");

        onValue(cardsRef, (snapshot) => {
            inventoryGrid.innerHTML = ""; // Clear existing cards
            snapshot.forEach((cardSnapshot) => {
                const cardData = cardSnapshot.val();
                const card = document.createElement("div");
                card.className = "feature-card";
                card.innerHTML = `
                    <img src="${cardData.image}" alt="${cardData.name}">
                    <h2>${cardData.name || "Unknown Card"}</h2>
                    <p>Rarity: ${cardData.rarity || "Unknown"}</p>
                `;

                // Click event to enlarge card
                card.addEventListener("click", () => {
                    card.classList.toggle("enlarged");
                    overlay.style.display = card.classList.contains("enlarged") ? "block" : "none";
                });

                inventoryGrid.appendChild(card);
            });
        });

        // Close enlarged card when overlay is clicked
        overlay.addEventListener("click", () => {
            const enlargedCard = document.querySelector(".feature-card.enlarged");
            if (enlargedCard) {
                enlargedCard.classList.remove("enlarged");
            }
            overlay.style.display = "none";
        });
    </script>
</body>
</html>
