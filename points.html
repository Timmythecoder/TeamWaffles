<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Waffles - Points</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #2b2b2b;
            margin: 0;
            padding: 0;
            color: #f5f5f5;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #444;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            position: relative;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #61dafb;
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            background-color: #3e3e3e;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            color: #f8f8f8;
        }

        th {
            background-color: #61dafb;
            color: #2b2b2b;
        }

        tr:hover {
            background-color: #333;
        }

        .home-button {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #a5fbb5;
            color: #2b2b2b;
            border: 2px solid #61dafb;
            border-radius: 10px;
            text-decoration: none;
            font-size: 1.2em;
            transition: transform 0.2s, background-color 0.2s;
        }

        .home-button:hover {
            background-color: #61dafb;
            color: #fff;
            transform: scale(1.05);
        }

        .dropdown-content {
            display: none;
            padding: 10px;
            margin-top: 10px;
            background-color: #3e3e3e;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .dropdown-content.show {
            display: block;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            justify-items: center;
        }

        .card {
            width: 100px;
            padding: 10px;
            background-color: #666;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .card img {
            max-width: 80%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        .card-info {
            margin-top: 10px;
            font-size: 0.8em;
        }

        .card-name {
            color: #a5fbb5;
        }

        .card-rarity {
            color: #ff9a9e;
        }

        /* The Modal (background) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            padding-top: 100px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.9);
        }

        .modal-content {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
        }

        #caption {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
            text-align: center;
            color: #ccc;
            padding: 10px 0;
            height: 150px;
        }

        .modal-content,
        #caption {
            animation-name: zoom;
            animation-duration: 0.6s;
        }

        @keyframes zoom {
            from {
                transform: scale(0)
            }

            to {
                transform: scale(1)
            }
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
        }

        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js';
        import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAPl8uaPdFS89m6X4M3OrzTSSeHhw-GkRk",
            authDomain: "team-waffles-acs.firebaseapp.com",
            projectId: "team-waffles-acs",
            storageBucket: "team-waffles-acs.firebasestorage.app",
            messagingSenderId: "636130806538",
            appId: "1:636130806538:web:281c39ba2e72debd2748f3",
            measurementId: "G-HEC29JWVFL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.loadUserPoints = function () {
            const usersRef = ref(db, 'users');

            onValue(usersRef, (snapshot) => {
                const users = snapshot.val();
                const usersList = document.getElementById("users-list");
                usersList.innerHTML = '';

                const sortedUsers = Object.entries(users).sort((a, b) => b[1].points - a[1].points);

                sortedUsers.forEach((user, index) => {
                    const username = user[0];
                    const points = user[1].points || 0;
                    const rank = index + 1;

                    const row = document.createElement("tr");
                    row.innerHTML = `<td>${rank}${getOrdinalSuffix(rank)}</td><td>${username}</td><td>${points}</td>`;
                    row.addEventListener('click', () => {
                        toggleDropdown(username);
                    });
                    usersList.appendChild(row);
                });
            });
        };

        window.toggleDropdown = function (username) {
            const existingDropdown = document.querySelector('.dropdown-content');
            if (existingDropdown) {
                existingDropdown.remove();
            }

            const userRef = ref(db, 'users/' + username + '/cards');
            onValue(userRef, (snapshot) => {
                const cards = snapshot.val();
                const usersList = document.getElementById("users-list");
                const dropdown = document.createElement("tr");
                const dropdownContent = document.createElement("td");
                dropdownContent.colSpan = 3;
                dropdownContent.className = "dropdown-content show";

                const cardsList = document.createElement("div");
                cardsList.className = "cards-grid";

                if (cards) {
                    Object.entries(cards).forEach(([key, card]) => {
                        const cardItem = document.createElement("div");
                        cardItem.className = 'card';
                        cardItem.innerHTML = `
                            <img src="${card.image}" alt="${card.name}" class="card-icon" onclick="openModal('${card.image}', '${card.name}')">
                            <span>${card.name} (${card.rarity})</span>
                        `;
                        cardsList.appendChild(cardItem);
                    });
                } else {
                    cardsList.innerHTML = '<p>No cards found for this user.</p>';
                }

                dropdownContent.appendChild(cardsList);
                dropdown.appendChild(dropdownContent);

                const rowIndex = Array.from(usersList.children).findIndex(row => row.textContent.includes(username));
                usersList.insertBefore(dropdown, usersList.children[rowIndex + 1]);
            });
        };

        function getOrdinalSuffix(num) {
            const j = num % 10,
                k = num % 100;
            if (j === 1 && k !== 11) {
                return "st";
            }
            if (j === 2 && k !== 12) {
                return "nd";
            }
            if (j === 3 && k !== 13) {
                return "rd";
            }
            return "th";
        }

        function openModal(src, alt) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById("modal-image");
            const captionText = document.getElementById("caption");

            modal.style.display = "block";
            modalImg.src = src;
            captionText.innerHTML = alt;
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadUserPoints();
        });

        window.onclick = function (event) {
            const modal = document.getElementById('imageModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        };

    </script>
</head>

<body>
    <div class="container">
        <h1>Team Waffles - User Points</h1>
        <div class="status">
            <h2>Leaderboard</h2>
       <!--    <a href="login.html" class="home-button">Login to Account</a> --> 
            <table id="pointsTable">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Username</th>
                        <th>Points</th>
                    </tr>
                </thead>
                <tbody id="users-list">
                    <!-- Dynamically updated list of users and their points will appear here -->
                </tbody>
            </table>
          <a href="index.html" class="home-button">Home</a>
        </div>
    </div>

    <!-- Modal for viewing images larger -->
    <div id="imageModal" class="modal">
        <span class="close" onclick="document.getElementById('imageModal').style.display='none'">&times;</span>
        <img class="modal-content" id="modal-image">
        <div id="caption"></div>
    </div>
</body>

</html>
