<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Waffles - Points</title>
    <link rel="stylesheet" href="points.css">

    <!-- Firebase Modular SDK -->
    <script type="module">
        // Import Firebase modules for Firebase 9+
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js';
        import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js';

        // Your Firebase configuration
        const firebaseConfig = {
  apiKey: "AIzaSyAPl8uaPdFS89m6X4M3OrzTSSeHhw-GkRk",
  authDomain: "team-waffles-acs.firebaseapp.com",
  projectId: "team-waffles-acs",
  storageBucket: "team-waffles-acs.firebasestorage.app",
  messagingSenderId: "636130806538",
  appId: "1:636130806538:web:281c39ba2e72debd2748f3",
  measurementId: "G-HEC29JWVFL"
};

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Function to load and display the list of users and their points, sorted by highest points
        window.loadUserPoints = function () {
            const usersRef = ref(db, 'users'); // Reference to the 'users' node in the database

            onValue(usersRef, (snapshot) => {
                const users = snapshot.val();
                const usersList = document.getElementById("users-list");
                usersList.innerHTML = ''; // Clear the table

                // Convert users object into an array and sort by points in descending order
                const sortedUsers = Object.entries(users).sort((a, b) => b[1].points - a[1].points);

                // Loop through each user and add a row to the table
                sortedUsers.forEach((user, index) => {
                    const username = user[0];
                    const points = user[1].points || 0; // Default to 0 if no points data is found
                    const rank = index + 1; // Rank starts from 1

                    const row = document.createElement("tr");
                    row.innerHTML = `<td>${rank}${getOrdinalSuffix(rank)}</td><td>${username}</td><td>${points}</td>`;
                    usersList.appendChild(row);
                });
            });
        };

        // Add ordinal suffix (e.g., "1st", "2nd", "3rd")
        function getOrdinalSuffix(num) {
            const j = num % 10,
                  k = num % 100;
            if (j === 1 && k !== 11) {
                return "st";
            }
            if (j === 2 && k !== 12) {
                return "nd";
            }
            if (j === 3 && k !== 13) {
                return "rd";
            }
            return "th";
        }

        // Load user points when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            loadUserPoints();
        });
    </script>
</head>
<body>
    <div class="container">
        <div class="points-page">
            <h1>Team Waffles - User Points</h1>
            <div class="status">
                <h2>Leaderboard</h2>
                <table id="pointsTable">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Username</th>
                            <th>Points</th>
                        </tr>
                    </thead>
                    <tbody id="users-list">
                        <!-- Dynamically updated list of users and their points will appear here -->
                    </tbody>
                </table>
                <a href="index.html" class="home-button"></a>
            </div>
        </div>
    </div>
</body>
</html>
